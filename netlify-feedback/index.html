<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Splash · Informes Beta</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #F6F4EC;
      color: #1D251C;
      margin: 0;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
    }
    main {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 28px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    p {
      margin: 0 0 20px;
      color: #4D584B;
      line-height: 1.45;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 12px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid #D4DDD0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
    }
    button {
      background: #2C7A3F;
      color: #FFFFFF;
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Splash · Feedback Beta</h1>
    <p>Este endpoint recibe automáticamente los informes enviados desde la app Android de Splash.</p>
    <form name="splash-beta-feedback" method="POST" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="splash-beta-feedback" />
      <input type="hidden" name="subject" value="Informe Splash Beta — %{formName} (%{submissionId})" />
      <p hidden><label>No rellenar: <input name="bot-field" /></label></p>

      <label>Usuario
        <input type="text" name="usuario" />
      </label>
      <label>Dispositivo
        <input type="text" name="dispositivo" />
      </label>
      <label>Versión
        <input type="text" name="version" />
      </label>
      <label>¿Cuánto te ayuda a dejar de scrollear o desconectar?
        <input type="text" name="ayuda_desconectar" />
      </label>
      <label>¿De acuerdo con controlar el máximo de notificaciones al día?
        <input type="text" name="control_notis" />
      </label>
      <label>Mapa favorito
        <input type="text" name="mapa_favorito" />
      </label>
      <label>Estilo de volteo de flashcard
        <input type="text" name="estilo_volteo" />
      </label>
      <label>Diseño de biomas
        <input type="text" name="diseno_biomas" />
      </label>
      <label>Cómo demostrar objetivos cumplidos
        <input type="text" name="como_demostrar" />
      </label>
      <label>Top 5 objetivos favoritos
        <input type="text" name="top5_favoritos" />
      </label>
      <label>Top 5 objetivos que menos gustan
        <input type="text" name="top5_menos" />
      </label>
      <label>Top 3 biomas favoritos
        <input type="text" name="top3_biomas_favoritos" />
      </label>
      <label>Top 3 biomas que menos gustan
        <input type="text" name="top3_biomas_menos" />
      </label>
      <label>Resumen del informe
        <textarea name="resumen_informe" rows="6"></textarea>
      </label>
      <label>Comentarios adicionales
        <textarea name="comentarios" rows="3"></textarea>
      </label>
      <label>Captura / Foto 1
        <input type="file" name="foto_1" accept="image/*" />
      </label>
      <label>Captura / Foto 2
        <input type="file" name="foto_2" accept="image/*" />
      </label>
      <label>Captura / Foto 3
        <input type="file" name="foto_3" accept="image/*" />
      </label>
      <button type="submit">Enviar informe</button>
    </form>
  </main>
</body>
</html>
